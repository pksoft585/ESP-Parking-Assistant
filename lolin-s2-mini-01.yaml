substitutions:
  device_name: lolin-s2-mini-01
  friendly_name: ESP Parking Assistant
  led_pin: GPIO9
  trigger_pin: GPIO11
  echo_pin: GPIO35
  user_led: GPIO15

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Lolin ESP32-S2 Mini-01 IoT DIY ESP Parking Assistant
  on_boot:
    - priority: -100
      then:
        # Start the LED effect after all components have initialized.
        - delay: 100ms
        - light.turn_on:
            id: led_strip
            effect: "Parking Assistant"
            brightness: 100%
        - delay: 2500ms
        - lambda: |-
            id(boot_animation) = false;
            id(is_awake) = false;
            id(exit_sleep_timer_started) = false;
            id(park_sleep_timer_started) = false;
        - lambda: |-
            // Enter standby after the boot indication.
            id(led_output_brightness) = -1;
            
esp32:
  board: lolin_s2_mini
  variant: esp32s2
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "13"

logger:
  level: INFO

api:
  encryption:
    key: "*****"
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
  - platform: web_server

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  fast_connect: true
  min_auth_mode: WPA2
  power_save_mode: none

  # Enable fallback hotspot (captive portal) in case wifi connection fails
#  ap:
#    ssid: "ESP Parking Assistant Fallback"
#    password: !secret wifi_ap_password

#captive_portal:

web_server:
  port: 80
  log: off
  version: 3
  local: true
#  ota: false
  sorting_groups:
    - id: pa_status
      name: "Parking Assistant"
      sorting_weight: 10
    - id: pa_distances
      name: "Distances"
      sorting_weight: 20
    - id: pa_strip
      name: "LED Strip"
      sorting_weight: 30
    - id: pa_led
      name: "LED Settings"
      sorting_weight: 40
    - id: pa_colors
      name: "LED Colors"
      sorting_weight: 50
    - id: pa_timing
      name: "Timing"
      sorting_weight: 60
    - id: pa_actions
      name: "Actions"
      sorting_weight: 70

preferences:
  flash_write_interval: 1min

globals:
  # State machine ---------------------------------------------------------
  - id: car_detected_state
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: is_awake
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: cold_start
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: previous_door_state
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: car_detected_counter
    type: int
    restore_value: no
    initial_value: '0'

  - id: no_car_detected_counter
    type: int
    restore_value: no
    initial_value: '0'

  - id: exit_sleep_timer_started
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: park_sleep_timer_started
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: start_time_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # LED state -------------------------------------------------------------
  - id: boot_animation
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: blink_on
    type: bool
    restore_value: no
    initial_value: 'false'

  # -1 means that the output brightness has not yet been applied.
  - id: led_output_brightness
    type: int
    restore_value: no
    initial_value: '-1'

  # Five-sample median filter for the value published to Home Assistant.
  - id: distance_samples
    type: float[5]
    restore_value: no
    initial_value: '{0, 0, 0, 0, 0}'

  - id: distance_sample_count
    type: int
    restore_value: no
    initial_value: '0'

  - id: distance_sample_index
    type: int
    restore_value: no
    initial_value: '0'

  - id: distance_publish_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

binary_sensor:
 #  Status
  - platform: status
    name: "PA Status"
    id: pa_status_bs
    icon: mdi:check-circle-outline
#    internal: true
    web_server:
      sorting_weight: 70
      sorting_group_id: pa_status

  - platform: template
    id: car_detected
    name: "PA Car Detected"
    icon: mdi:car-outline
    device_class: presence
    entity_category: diagnostic
    web_server:
      sorting_group_id: pa_status
      sorting_weight: 10
    lambda: |-
      return id(car_detected_state);

sensor:
  # Uptime Sensor
  - platform: uptime
    name: "PA Uptime"
    id: pa_uptime
    update_interval: 15s
    web_server:
      sorting_weight: 80
      sorting_group_id: pa_status

  # Raw HC-SR04 measurement. ESPHome returns meters; the parking logic uses mm.
  - platform: ultrasonic
    id: parking_distance_raw
    internal: true
    trigger_pin: ${trigger_pin}
    echo_pin: ${echo_pin}
    update_interval: 200ms
    timeout: 3.0m
    unit_of_measurement: "mm"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          if (isnan(x)) {
            return id(sensor_max_distance).state;
          }
          float mm = x * 1000.0f;
          float min_mm = id(sensor_min_distance).state;
          float max_mm = id(sensor_max_distance).state;
          if (mm < min_mm) mm = min_mm;
          if (mm > max_mm) mm = max_mm;
          return mm;

  - platform: template
    id: parking_distance
    name: "PA Parking Distance"
    icon: mdi:align-horizontal-distribute
    unit_of_measurement: "mm"
    device_class: distance
    state_class: measurement
    accuracy_decimals: 0
    web_server:
      sorting_group_id: pa_status
      sorting_weight: 20

  # Wifi Signal Sensor
  - platform: wifi_signal
    name: "PA Wifi signal"
    id: pa_wifi_signal
    icon: mdi:wifi
    update_interval: 60s
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    entity_category: "diagnostic"
    web_server:
      sorting_weight: 90
      sorting_group_id: pa_status
  - platform: copy # WiFi signal strength in %
    name: "PA Wifi signal (%)"
    id: pa_wifi_signal_prct
    icon: mdi:wifi
    source_id: pa_wifi_signal
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    device_class: ""
    web_server:
      sorting_weight: 95
      sorting_group_id: pa_status
 
