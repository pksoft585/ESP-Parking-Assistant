switch:
  # Restarts
  - platform: restart
    name: "PA Restart"
    id: pa_restart_switch
    web_server:
      sorting_weight: 10
      sorting_group_id: pa_actions
  - platform: safe_mode
    name: "PA Restart (Safe Mode)"
    id: pa_safe_mode_switch
    entity_category: config
    web_server:
      sorting_weight: 20
      sorting_group_id: pa_actions
      
  # This replaces the old MQTT cmnd/parkasst/door switch.
  - platform: template
    name: "PA Door State"
    id: door_state
    icon: mdi:garage
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    web_server:
      sorting_group_id: pa_status
      sorting_weight: 30
    on_turn_on:
      - lambda: |-
          // Door state only controls the parking LED state machine.
          // Car detection continues independently.
          if (id(car_detected_state)) {
            id(is_awake) = true;
            id(exit_sleep_timer_started) = false;
            id(park_sleep_timer_started) = true;
            id(start_time_ms) = millis();
          }
      - light.turn_on: pa_user_led
    on_turn_off:
      - lambda: |-
          // Keep Car Detected running, but put the parking LEDs into standby.
          id(is_awake) = false;
          id(exit_sleep_timer_started) = false;
          id(park_sleep_timer_started) = false;
      - light.turn_off: pa_user_led

output:
  - platform: gpio
    pin:
      number: ${user_led}
      id: pa_user_led_gpio

light:
  - platform: binary
    name: "PA User LED"
    id: pa_user_led
    icon: mdi:led-outline
    output: pa_user_led_gpio

  - platform: esp32_rmt_led_strip
    name: "PA LED Strip"
    id: led_strip
    pin: GPIO9
    num_leds: 30
    icon: mdi:led-strip-variant
    chipset: WS2812
    channel_colors: GRB
    max_refresh_rate: 20ms
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: "Parking Assistant"
          update_interval: 20ms
          lambda: |-
            const int n = std::max(1, std::min(30, (int) id(led_count).state));

            auto get_color = [](const std::string &name) -> Color {
              if (name == "Red")    return Color(255, 0, 0);
              if (name == "Yellow") return Color(255, 255, 0);
              if (name == "Green")  return Color(0, 255, 0);
              if (name == "Blue")   return Color(0, 0, 255);
              if (name == "White")  return Color(255, 255, 255);
              if (name == "Pink")   return Color(255, 105, 180);
              if (name == "Orange") return Color(255, 165, 0);
              if (name == "Lime")   return Color(50, 205, 50);
              if (name == "Cyan")   return Color(0, 255, 255);
              if (name == "Gray")   return Color(128, 128, 128);
              return Color(0, 0, 0);
            };

            const Color c_standby = get_color(std::string(id(standby_color).current_option()));
            const Color c_wake    = get_color(std::string(id(wake_color).current_option()));
            const Color c_active  = get_color(std::string(id(active_color).current_option()));
            const Color c_parked  = get_color(std::string(id(parked_color).current_option()));
            const Color c_backup  = get_color(std::string(id(backup_color).current_option()));

            // Always clear the complete physical strip first. This is important
            // when the configured number of LEDs is reduced.
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(0, 0, 0);
            }

            // Boot indication: yellow/green checkerboard.
            if (id(boot_animation)) {
              for (int i = 0; i < n; i += 2) {
                it[i] = Color(255, 255, 0);
                if (i + 1 < n) {
                  it[i + 1] = Color(0, 255, 0);
                }
              }
              return;
            }

            const float distance = id(parking_distance_raw).state;
            const float wake = id(wake_distance).state;
            const float start = id(start_distance).state;
            const float park = id(park_distance).state;
            const float backup = id(backup_distance).state;
            const int half = std::max(1, n / 2);

            // Standby: only the two edge LEDs are lit.
            if (!id(car_detected_state) || !id(is_awake)) {
              if (id(sleep_brightness).state > 0) {
                it[0] = c_standby;
                it[n - 1] = c_standby;
              }
              return;
            }

            // Backup: flashing full strip.
            if (distance <= backup) {
              if (id(blink_on)) {
                for (int i = 0; i < n; i++) it[i] = c_backup;
              }
              return;
            }

            // Parked: full strip.
            if (distance <= park) {
              for (int i = 0; i < n; i++) it[i] = c_parked;
              return;
            }

            // Wake: full green (or selected wake color).
            if (distance > start && distance <= wake) {
              for (int i = 0; i < n; i++) it[i] = c_wake;
              return;
            }

            // Active range: selected effect.
            const int span = std::max(1, (int) (start - park));
            const std::string effect = std::string(id(led_effect).current_option());
            int number_to_light = 1;

            if (effect == "Out-In" || effect == "In-Out") {
              const int interval = std::max(1, span / half);
              number_to_light = (int) ((start - distance) / interval);
              number_to_light = std::max(1, std::min(half, number_to_light));
            } else if (effect == "Full-Strip" || effect == "Full-Strip-Inv") {
              const int interval = std::max(1, span / n);
              number_to_light = (int) ((start - distance) / interval);
              number_to_light = std::max(1, std::min(n, number_to_light));
            }

            if (effect == "Out-In") {
              for (int i = 0; i < number_to_light; i++) {
                it[i] = c_active;
                it[n - 1 - i] = c_active;
              }
            } else if (effect == "In-Out") {
              int left = n / 2;
              int right = left;
              if ((left % 2) == 0) left--;
              for (int i = 0; i < number_to_light; i++) {
                const int li = left - i;
                const int ri = right + i;
                if (li >= 0) it[li] = c_active;
                if (ri < n) it[ri] = c_active;
              }
            } else if (effect == "Full-Strip") {
              for (int i = 0; i < number_to_light; i++) it[i] = c_active;
            } else if (effect == "Full-Strip-Inv") {
              for (int i = 0; i < number_to_light; i++) it[n - 1 - i] = c_active;
            } else if (effect == "Solid") {
              // The original Solid effect follows the same color stages.
              if (distance > start && distance <= wake) {
                for (int i = 0; i < n; i++) it[i] = c_wake;
              } else if (distance > park && distance <= start) {
                for (int i = 0; i < n; i++) it[i] = c_active;
              } else if (distance > backup && distance <= park) {
                for (int i = 0; i < n; i++) it[i] = c_parked;
              }
            }
    web_server:
      sorting_weight: 10
      sorting_group_id: pa_strip

time:
  - platform: sntp
    id: pa_time
    timezone: Europe/Prague
    servers:
      - ntp.nic.cz
      - 0.pool.ntp.org
      - 1.pool.ntp.org

interval:
  # This is the equivalent of the original ~200 ms main loop timing.
  - interval: 200ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          const float distance = id(parking_distance_raw).state;
          const float wake = id(wake_distance).state;
          const bool door_open = id(door_state).state;

          // Store every 200 ms measurement. The value exposed to HA is
          // published only once per second as the median of the last five
          // valid measurements. Parking/LED logic continues to use the raw
          // measurement for fast response.
          if (!isnan(distance)) {
            id(distance_samples)[id(distance_sample_index)] = distance;
            id(distance_sample_index) = (id(distance_sample_index) + 1) % 5;
            if (id(distance_sample_count) < 5) {
              id(distance_sample_count)++;
            }

            if (id(distance_sample_count) >= 5 &&
                (now - id(distance_publish_ms) >= 1000 || id(distance_publish_ms) == 0)) {
              float values[5];
              for (int i = 0; i < 5; i++) {
                values[i] = id(distance_samples)[i];
              }
              for (int i = 1; i < 5; i++) {
                float v = values[i];
                int j = i - 1;
                while (j >= 0 && values[j] > v) {
                  values[j + 1] = values[j];
                  j--;
                }
                values[j + 1] = v;
              }
              id(parking_distance).publish_state(values[2]);
              id(distance_publish_ms) = now;
            }
          }

          // Car detection runs continuously, regardless of the garage door state.
          // PA Door State only enables/disables the parking LED state machine.
          if (door_open != id(previous_door_state)) {
            id(previous_door_state) = door_open;
          }

          // The parking LED state machine is idle while the garage door is closed,
          // but Car Detected continues to be evaluated below.
          if (!door_open) {
            id(is_awake) = false;
            id(exit_sleep_timer_started) = false;
            id(park_sleep_timer_started) = false;
            id(blink_on) = false;
          }

          // Do not run parking LED timing during the boot animation.
          const bool booting = id(boot_animation);

          // Car detection is always active, regardless of the garage door state.
          // Only the parking LED state machine depends on PA Door State.
          if (distance <= wake) {
            id(no_car_detected_counter) = 0;
            if (!id(car_detected_state)) {
              id(car_detected_counter)++;
            }

            if (id(car_detected_counter) > 3) {
              id(car_detected_counter) = 0;
              id(car_detected_state) = true;

              if (door_open && !booting) {
                id(exit_sleep_timer_started) = false;
                id(park_sleep_timer_started) = true;
                id(start_time_ms) = now;
                id(is_awake) = true;
              }
            }
          } else {
            id(car_detected_counter) = 0;
            if (id(car_detected_state)) {
              id(no_car_detected_counter)++;
            }

            if (id(no_car_detected_counter) > 10) {
              id(car_detected_state) = false;
              id(no_car_detected_counter) = 0;

              if (door_open && !booting) {
                if (!id(exit_sleep_timer_started)) {
                  id(exit_sleep_timer_started) = true;
                  id(park_sleep_timer_started) = false;
                  id(start_time_ms) = now;
                }
              }
            }
          }

          if (!booting && door_open) {
            // Same timer behavior as the Arduino version.
            const uint32_t elapsed = now - id(start_time_ms);
            if ((id(park_sleep_timer_started) &&
                 elapsed > (uint32_t) (id(max_operation_time_park).state * 1000.0f)) ||
                (id(exit_sleep_timer_started) &&
                 elapsed > (uint32_t) (id(max_operation_time_exit).state * 1000.0f))) {
              id(is_awake) = false;
              id(start_time_ms) = now;
              id(exit_sleep_timer_started) = false;
              id(park_sleep_timer_started) = false;
            }

            // Flash state is toggled at the same ~200 ms cadence as the old loop.
            id(blink_on) = !id(blink_on);

            // Set brightness only when the desired operating state changes.
            const int desired_brightness = id(is_awake)
                ? (int) id(active_brightness).state
                : (int) id(sleep_brightness).state;

            if (id(led_output_brightness) != desired_brightness) {
              id(led_output_brightness) = desired_brightness;
              auto call = id(led_strip).turn_on();
              call.set_brightness(desired_brightness / 255.0f);
              call.set_effect("Parking Assistant");
              call.perform();
            }
          }
